name: app
description: A Flutter app for Smart Charging Station with Firebase integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase packages
  firebase_core: ^2.31.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0

  # UI & charts
  cupertino_icons: ^1.0.6
  fl_chart: ^0.66.2

  # Date & formatting
  intl: ^0.18.0
  firebase_database: ^10.5.7
  shared_preferences: ^2.5.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
